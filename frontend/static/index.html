<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analista Financiero IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Agente de análisis financiero</h1>
      <p class="muted" id="api-info">Conectando…</p>
    </div>
    <div class="limits" id="limits"></div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Consulta</h2>
      <form id="query-form">
        <div class="row">
          <label>analyst_id <input name="analyst_id" value="A01" required></label>
          <label>session_id
            <span class="inline">
              <input name="session_id" value="S001" required>
              <button type="button" class="ghost" id="new-session" title="Generar una sesión nueva">Nueva</button>
            </span>
          </label>
        </div>
        <label>query <textarea name="query" rows="4">Calcula la razón corriente (activo corriente / pasivo corriente) de 2024.</textarea></label>
        <label>max_budget_usd <input name="max_budget_usd" type="number" step="0.0001" value="0.50"></label>
        <button type="submit" id="submit">Enviar consulta</button>
      </form>

      <div class="session" id="session"></div>

      <div class="cases-head">
        <h2>Casos de prueba</h2>
        <button class="ghost" id="run-all">Ejecutar todos</button>
      </div>
      <p class="muted small">Cada caso indica la respuesta esperada. Los marcados con <span class="tag">LLM</span>
        dependen del modelo real; el resto se determina por las reglas del dominio.</p>
      <ul class="cases" id="cases"></ul>
    </section>

    <section class="panel result" id="result">
      <div class="empty">Envía una consulta o ejecuta un caso de prueba.</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
